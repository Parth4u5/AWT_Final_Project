# CI baseline — build list task 0.23 (docs/BUILD_LIST.md §5.5).
# Every PR is gated by lint, typecheck, test and build on Node 22 and 24.
#
# Deferred quality gates (tracked in docs/BUILD_LIST.md — intentionally not silent omissions):
#   TODO(Phase 1): coverage thresholds via @vitest/coverage-v8 in the `test` job (§1.5, §2 gate).
#   TODO(Phase 3): Lighthouse CI with asserted scores (§4.1 "Quality gates", §1.6).
#   TODO(Phase 3): size-limit bundle budget (200 KB) in the `build` job (§4.1, §1.5).
#   TODO(Phase 3): axe a11y gate with asserted results — docs/BUILD_LIST.md §4.1 "Quality gates".
#   TODO(later):   Turborepo remote cache (TURBO_TOKEN/TURBO_TEAM) once the repo is public (§4.1, D2).

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same ref are cancelled (e.g. a force-push during review).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup v4 reads the pinned version from packageManager ("pnpm@10.34.9").
      - uses: pnpm/action-setup@v4
        with:
          cache: true

      # Must come after pnpm/action-setup so `cache: pnpm` can find the store path.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Cache Turborepo graph
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-node${{ matrix.node-version }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Cache Turborepo graph
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-node${{ matrix.node-version }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Cache Turborepo graph
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-node${{ matrix.node-version }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TODO(Phase 1): add `pnpm test:coverage` with @vitest/coverage-v8 thresholds here.
      # See docs/BUILD_LIST.md §1.5 and the Phase 1 gate in §2.
      # `--passWithNoTests` in the package manifests is temporary: it keeps CI green
      # until real tests land in Phase 1 task 1.8, then it should be removed.
      - name: Test
        run: pnpm test

      # Safety-critical env validator coverage. Synthetic values only — never
      # use real secrets here.
      - name: Env validator smoke test
        run: |
          export JWT_SECRET="$(openssl rand -hex 20)"  # 40 random chars
          export MONGO_URI="mongodb://127.0.0.1:27017/jsflow_test"
          export ALLOWED_ORIGINS="http://localhost:5173"
          node scripts/check-env.mjs
          # Negative case: a wildcard origin must be rejected (exit 1).
          if ALLOWED_ORIGINS='*' node scripts/check-env.mjs; then
            echo "expected ALLOWED_ORIGINS='*' to be rejected" >&2
            exit 1
          fi
          # Regression (spec §5.7.1 / D13): rotated-in-place URI accepted,
          # revoked DB user still rejected.
          node scripts/check-env.regression.mjs

  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Cache Turborepo graph
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-node${{ matrix.node-version }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TODO(Phase 3): Lighthouse CI (asserted scores) + size-limit (200 KB) gates go here.
      # See docs/BUILD_LIST.md §4.1 "Quality gates" and §1.6.
      - name: Build
        run: pnpm build
