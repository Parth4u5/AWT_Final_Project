# pnpm workspace definition + single-source dependency catalog.
# Every shared version below is copied verbatim from docs/BUILD_LIST.md §1
# and docs/INSTALLATION.md §8. Packages reference these with "catalog:" and
# must never hardcode a shared version.

packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
